<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | {FIRM}</title>
  <link rel="icon" href="img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <h1>Contact Us</h1>
  <div class="breadcrumb"><a href="index.html">Home</a> / Contact Us</div>
</div></section>
<section><div class="container">
  <div class="contact-grid">
    <div class="contact-info reveal">
      <div class="section-title"><h2>Get in Touch</h2><p class="lead">Contact us by phone, email or the form, or visit our office. All enquiries are treated in confidence.</p></div>
      <div id="contact-info"></div>
    </div>
    <div class="form-card reveal">
      <form id="contact-form">
        <div class="form-msg" role="status"></div>
        <div class="row">
          <div><label for="name">Full name *</label><input id="name" name="name" required></div>
          <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
        </div>
        <div class="row">
          <div><label for="company">Company</label><input id="company" name="company"></div>
          <div><label for="topic">Area of interest</label>
            <select id="topic" name="topic"><option>General enquiry</option><option>Legal advice</option><option>Contract drafting</option><option>Internal rules and charters</option><option>Civil case</option><option>Criminal case</option><option>Administrative case</option><option>Tax law advice</option><option>Financial or accounting advice</option><option>Legal training and research</option><option>Careers</option></select></div>
        </div>
        <label for="message">Message *</label><textarea id="message" name="message" required maxlength="5000"></textarea>
        <div class="hp" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <button class="btn" type="submit">Send message</button>
      </form>
    </div>
  </div>
  <div class="map reveal"><div class="pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/></svg><span data-site="legal"></span></div></div>
</div></section>
<div id="site-footer"></div>
</body>
</html>
